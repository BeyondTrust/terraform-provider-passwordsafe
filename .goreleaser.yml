# GoReleaser configuration for the Terraform Provider.
# Reference: https://developer.hashicorp.com/terraform/registry/providers/publishing
# Template:  https://github.com/hashicorp/terraform-provider-scaffolding-framework
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      # CGO off: portable static binaries for Terraform Cloud and other CI.
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
      - '386'
    goarm:
      - "6"
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [ "zip" ]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

# GPG signing of the checksums is required by the Terraform Registry.
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # Stay in draft; the workflow's publish job flips it out once artifacts are attached.
  draft: true
  # Upload into release-please's existing draft; without this GoReleaser 404s on the
  # get-release-by-tag lookup (drafts aren't returned) and creates a duplicate.
  use_existing_draft: true
  # release-please owns the release notes; keep its body untouched.
  mode: keep-existing
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  disable: true
