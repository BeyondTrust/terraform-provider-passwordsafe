name: Release

# release-please maintains a release PR; merging it tags a draft release, GoReleaser
# signs and uploads artifacts, then publish flips it out of draft for the Terraform
# Registry webhook. All in one run so no PAT is needed to chain off the tag push.
# https://developer.hashicorp.com/terraform/registry/providers/publishing

on:
  push:
    branches:
      - main

# Serialize releases; queue newer pushes rather than cancel (a half-done draft/tag is worse).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # create the git tag and the draft release
      pull-requests: write  # maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      security-events: read  # read Code Scanning alerts to evaluate the SLA policy
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Security gate
        uses: ./.github/actions/security-gate

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release-please, security-gate]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write       # upload artifacts to the draft release
      id-token: write       # OIDC for keyless signing of the build provenance attestation
      attestations: write   # store the build provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0  # Required for GoReleaser to access full tag history

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Attest build provenance
        # SLSA provenance for the zips and the SHA256SUMS manifest consumers verify against.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS

  # Dependency-graph SBOM (resolved module deps, not a per-artifact BOM). Best-effort:
  # never blocks publish (see the publish job's `if`).
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read  # read the dependency graph to generate the SBOM
    steps:
      - name: Generate SBOM
        id: sbom
        run: |
          file="terraform-provider-passwordsafe_${TAG_NAME#v}_sbom.spdx.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" \
            --jq '.sbom' > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

      - name: Upload SBOM as workflow artifact
        # Not a release asset: the Terraform Registry rejects a release with a *.spdx.json
        # ("invalid file extension found (.json)"), so keep the SBOM on the run instead.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ steps.sbom.outputs.file }}
          retention-days: 90
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Not gated on sbom: it's a workflow artifact, so it runs in parallel and never blocks publish.
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write  # flip the release out of draft
    steps:
      - name: Publish GitHub release
        # Flips the draft out, firing the "release: published" event the Registry ingests.
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
