# Validates that the GoReleaser build matrix compiles on every PR, before the
# real Release workflow runs it on main. Snapshot mode skips publish/announce, and
# we additionally skip signing (--skip=sign) since the GPG key is not available
# here, so no secrets are needed and it is safe to run on PRs from forks.
name: Build Snapshot

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: GoReleaser Snapshot Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # GoReleaser needs full tag history to compute the version

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ github.token }}
