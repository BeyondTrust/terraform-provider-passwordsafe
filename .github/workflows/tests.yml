name: Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  unit_test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform

      - name: Run unit tests
        run: |
          export TF_ACC=1
          go mod tidy
          go test -cover -coverprofile=coverage.txt ./...
          ls -alt
        working-directory: providers

      - name: Save unit tests coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: providers/coverage.txt
          retention-days: 5

      # Run native Go fuzz targets for a short, bounded time. -run='^$' skips
      # the unit tests (already covered above) so only the fuzz pass executes.
      # -fuzz accepts a single target per invocation, so loop over each one.
      # These cover the auth handshake, secret retrieval and managed-account
      # retrieval flows (against mock servers) plus the change-frequency validator.
      - name: Run fuzz tests
        run: |
          set -euo pipefail
          for target in \
            FuzzValidateChangeFrequencyDays \
            FuzzAuthenticationFlow \
            FuzzGetSecretFlow \
            FuzzManageAccountFlow; do
            echo "::group::fuzz ${target}"
            go test -run='^$' -fuzz="^${target}$" -fuzztime=30s ./utils/
            echo "::endgroup::"
          done
        working-directory: providers
